name: CI

on:
  push:
    branches: [main, feature/**, fix/**, chore/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation
        run: |
          pnpm run docs:test
          pnpm run docs:check

      - name: Type check
        run: pnpm run typecheck

      - name: Run ESLint
        run: pnpm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  e2e:
    name: API and Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies and browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Start disposable Supabase
        run: |
          pnpm dlx supabase@2.119.0 start --exclude studio,imgproxy,vector,logflare,edge-runtime > /tmp/supabase-start.log 2>&1 || { cat /tmp/supabase-start.log; exit 1; }
          pnpm dlx supabase@2.119.0 status -o json > /tmp/supabase-status.json
          python3 - <<'PY'
          import json, os
          status = json.load(open('/tmp/supabase-status.json'))
          values = {
              'NEXT_PUBLIC_SUPABASE_URL': status['API_URL'],
              'NEXT_PUBLIC_SUPABASE_ANON_KEY': status['ANON_KEY'],
              'SUPABASE_SERVICE_ROLE_KEY': status['SERVICE_ROLE_KEY'],
              'NEXT_PUBLIC_SITE_URL': 'http://localhost:3000',
              'E2E_MAILPIT_URL': status['MAILPIT_URL'],
              'RESEND_API_KEY': '',
              'SLACK_WEBHOOK_URL': '',
              'WEBHOOK_SECRET': 'isolated-local-newsletter-test',
              'CRON_SECRET': 'isolated-local-newsletter-cron-test',
          }
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PY

      - name: Verify author profile database privacy
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/public_author_profiles.sql

      - name: Verify private draft recovery permissions
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/post_working_copies.sql

      - name: Verify URL reservation constraints and privacy
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/post_slug_routes.sql

      - name: Verify atomic post rollback and retry contracts
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/atomic_posts.sql

      - name: Verify taxonomy merges and aliases
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/tag_taxonomy.sql

      - name: Verify image retention and cleanup permissions
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/post_media.sql

      - name: Verify newsletter queue retry and cancellation contracts
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/newsletter_queue.sql

      - name: Run API and browser tests
        run: pnpm run test:e2e

      - name: Verify OAuth controls with isolated provider navigation
        run: pnpm exec playwright test --config=e2e/oauth-ui.config.ts

      - name: Upload failed test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

      - name: Stop disposable Supabase
        if: always()
        run: pnpm dlx supabase@2.119.0 stop --no-backup
